<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balloon Pop English Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           ESTILOS GENERALES Y ESTÉTICA INFANTIL
           ========================================= */
        :root {
            --bg-color: #87CEEB;
            --bg-gradient: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
            --balloon-colors: #FF6B6B, #4ECDC4, #FFE66D, #FF9F43, #A29BFE, #FD79A8;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation; /* Mejora la respuesta táctil en móviles */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        /* =========================================
           UI: CABECERA Y PALABRA OBJETIVO
           ========================================= */
        #game-ui {
            position: absolute;
            top: 5vh;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }

        #speaker-btn {
            pointer-events: auto;
            background: #fff;
            border: 4px solid #FF9F43;
            border-radius: 50%;
            width: 15vmin;
            height: 15vmin;
            font-size: 8vmin;
            cursor: pointer;
            box-shadow: 0 6px 0 #E67E22, 0 10px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2vh;
        }

        #speaker-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #E67E22, 0 4px 4px rgba(0,0,0,0.2);
        }

        #target-word {
            font-family: 'Fredoka One', cursive;
            font-size: 8vmin;
            color: #2D3436;
            text-shadow: 3px 3px 0px #FFF;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            padding: 1vh 4vw;
            border-radius: 20px;
            display: inline-block;
        }

        #target-word.visible {
            opacity: 1;
        }

        /* =========================================
           ÁREA DE JUEGO Y GLOBOS
           ========================================= */
        #game-area {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            bottom: -25vh;
            width: 18vmin;
            height: 22vmin;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: inset -1vmin -1vmin 2vmin rgba(0,0,0,0.1), 0 1vmin 0.5vmin rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* Contenedor interno del emoji para animar SOLO el emoji sin afectar la flotación del globo */
        .balloon-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10vmin;
            transition: filter 0.2s ease;
        }

        /* La cuerda del globo */
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -2.5vmin;
            left: 50%;
            transform: translateX(-50%);
            width: 0.4vmin;
            height: 3vmin;
            background: rgba(0,0,0,0.3);
        }

        .balloon::before {
            content: '';
            position: absolute;
            bottom: -0.5vmin;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 1vmin solid transparent;
            border-right: 1vmin solid transparent;
            border-top: 1.5vmin solid inherit;
        }

        .balloon:active {
            transform: scale(0.95);
        }

        /* Animación de flotar (solo afecta al globo) */
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-25vh) rotate(2deg); }
            50% { transform: translateY(-50vh) rotate(-2deg); }
            75% { transform: translateY(-75vh) rotate(1deg); }
            100% { transform: translateY(-120vh) rotate(0deg); }
        }

        /* Animación de error (SOLO afecta al emoji interior, el globo sigue flotando) */
        @keyframes shake-emoji {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-1.5vmin) rotate(-10deg); }
            40% { transform: translateX(1.5vmin) rotate(10deg); }
            60% { transform: translateX(-1.5vmin) rotate(-10deg); }
            80% { transform: translateX(1.5vmin) rotate(10deg); }
        }

        .shake-error .balloon-content {
            animation: shake-emoji 0.4s ease-in-out;
            filter: brightness(0.7) sepia(1) hue-rotate(-50deg) saturate(5); /* Tinte rojo sutil */
        }

        /* Animación de explosión */
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        .popped {
            animation: pop 0.3s ease-out forwards !important;
            pointer-events: none;
        }

        /* =========================================
           PANTALLA FINAL Y REPASO
           ========================================= */
        #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            text-align: center;
            padding: 5vmin;
        }

        #end-screen h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 10vmin;
            color: #FF9F43;
            margin-bottom: 2vh;
            text-shadow: 2px 2px 0 #FFF;
        }

        #end-screen p {
            font-size: 4vmin;
            color: #2D3436;
            margin-bottom: 4vh;
        }

        #mistakes-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3vmin;
            margin-bottom: 4vh;
            max-width: 80vw;
        }

        .mistake-item {
            background: #FFF;
            border: 3px solid #FF6B6B;
            border-radius: 15px;
            padding: 2vmin;
            font-size: 6vmin;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            /* CORRECCIÓN: Se eliminó la animación 'floatUp' para que se queden quietas */
        }

        .restart-btn {
            background: #4ECDC4;
            color: white;
            border: none;
            padding: 3vmin 8vmin;
            font-size: 5vmin;
            font-family: 'Fredoka One', cursive;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #2A9D8F, 0 10px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2A9D8F, 0 4px 4px rgba(0,0,0,0.2);
        }

        /* Confeti simple */
        .confetti {
            position: absolute;
            width: 2vmin;
            height: 2vmin;
            background: #f00;
            animation: fall linear forwards;
            z-index: 300;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<body>

    <!-- UI Superior -->
    <div id="game-ui">
        <button id="speaker-btn" onclick="playCurrentWord()">🔊</button>
        <div id="target-word"></div>
    </div>

    <!-- Área donde flotan los globos -->
    <div id="game-area"></div>

    <!-- Pantalla Final -->
    <div id="end-screen">
        <h1>¡Great Job! 🎉</h1>
        <p>¡Lo hiciste muy bien!</p>
        <div id="mistakes-title" style="display:none; font-size: 4vmin; color: #FF6B6B; font-weight: bold; margin-bottom: 2vh;">
            Practiquemos estas un poco más:
        </div>
        <div id="mistakes-container"></div>
        <button class="restart-btn" onclick="initGame()">Jugar Otra Vez 🔄</button>
    </div>

    <script>
        /* =========================================
           1. CONFIGURACIÓN Y VOCABULARIO (EDITAR AQUÍ)
           ========================================= */
        const vocabulary = [
            { word: "Happy", emoji: "😀" },
            { word: "Sleepy", emoji: "🥱" },
            { word: "Angry", emoji: "😡" },
            { word: "Surprised", emoji: "😲" },
            { word: "Excited", emoji: "🤩" },
            { word: "Sad", emoji: "😢" },
            { word: "Nervous", emoji: "😬" },
            { word: "Silly", emoji: "🤪" }
        ];

        const balloonColors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF9F43', '#A29BFE', '#FD79A8', '#55E6C1'];

        /* =========================================
           2. VARIABLES DE ESTADO DEL JUEGO
           ========================================= */
        let gameQueue = [];
        let currentIndex = 0;
        let mistakes = [];
        let isLevelActive = false;
        let speechSynth = window.speechSynthesis;

        /* =========================================
           3. FUNCIONES DE AUDIO (Web Speech API + Oscilador)
           ========================================= */
        function speak(text) {
            if (speechSynth.speaking) speechSynth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            speechSynth.speak(utterance);
        }

        function playSuccessSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        function playErrorSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        /* =========================================
           4. LÓGICA DEL JUEGO
           ========================================= */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            gameQueue = shuffleArray([...vocabulary]);
            currentIndex = 0;
            mistakes = [];
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('game-area').innerHTML = '';
            
            loadLevel();
        }

        function loadLevel() {
            isLevelActive = true;
            const currentData = gameQueue[currentIndex];
            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = '';

            let distractors = vocabulary.filter(v => v.word !== currentData.word);
            distractors = shuffleArray(distractors).slice(0, 2);
            let options = shuffleArray([currentData, ...distractors]);

            options.forEach((opt, index) => {
                createBalloon(opt, opt.word === currentData.word, index);
            });

            document.getElementById('target-word').classList.remove('visible');
        }

        function createBalloon(data, isCorrect, index) {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            
            const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];
            balloon.style.backgroundColor = color;
            balloon.style.borderTopColor = color;

            const leftPos = 10 + (Math.random() * 70);
            balloon.style.left = leftPos + '%';

            const duration = 6 + Math.random() * 4;
            const delay = Math.random() * 2;
            balloon.style.animation = `floatUp ${duration}s linear ${delay}s infinite`;

            // CORRECCIÓN: Contenido separado para que el emoji tiemble, pero el globo siga flotando sin desaparecer
            const content = document.createElement('div');
            content.className = 'balloon-content';
            content.textContent = data.emoji;
            balloon.appendChild(content);

            balloon.addEventListener('click', (e) => {
                e.stopPropagation();
                handleBalloonClick(balloon, isCorrect, data);
            });

            document.getElementById('game-area').appendChild(balloon);
        }

        function playCurrentWord() {
            if (currentIndex >= gameQueue.length) return;
            const currentData = gameQueue[currentIndex];
            
            speak(currentData.word);
            
            const wordEl = document.getElementById('target-word');
            wordEl.textContent = currentData.word;
            wordEl.classList.add('visible');
            
            setTimeout(() => {
                wordEl.classList.remove('visible');
            }, 1000);
        }

        function handleBalloonClick(balloon, isCorrect, data) {
            if (!isLevelActive) return;

            if (isCorrect) {
                isLevelActive = false;
                playSuccessSound();
                balloon.classList.add('popped');
                createConfetti(balloon.getBoundingClientRect());
                
                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex < gameQueue.length) {
                        loadLevel();
                    } else {
                        endGame();
                    }
                }, 800);
            } else {
                // CORRECCIÓN: El globo NO desaparece. Solo el emoji interior tiembla y se pone rojo.
                playErrorSound();
                balloon.classList.add('shake-error');
                
                if (!mistakes.find(m => m.word === data.word)) {
                    mistakes.push(data);
                }

                // Quitar la clase de error después de la animación para que pueda volver a intentarse
                setTimeout(() => {
                    balloon.classList.remove('shake-error');
                }, 400);
            }
        }

        function endGame() {
            const endScreen = document.getElementById('end-screen');
            const mistakesContainer = document.getElementById('mistakes-container');
            const mistakesTitle = document.getElementById('mistakes-title');
            
            mistakesContainer.innerHTML = '';
            
            if (mistakes.length > 0) {
                mistakesTitle.style.display = 'block';
                mistakes.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'mistake-item';
                    div.textContent = m.emoji;
                    div.title = m.word;
                    mistakesContainer.appendChild(div);
                });
                speak("Great job! Let's review these ones.");
            } else {
                mistakesTitle.style.display = 'none';
                speak("Excellent! Perfect score!");
            }
            
            endScreen.style.display = 'flex';
            launchFullConfetti();
        }

        /* =========================================
           5. EFECTOS VISUALES (CONFETI)
           ========================================= */
        function createConfetti(rect) {
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#0ff', '#f0f'];
            for (let i = 0; i < 20; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = (rect.left + rect.width / 2) + 'px';
                conf.style.top = (rect.top + rect.height / 2) + 'px';
                
                const tx = (Math.random() - 0.5) * 200;
                const ty = (Math.random() - 0.5) * 200;
                conf.style.transform = `translate(${tx}px, ${ty}px)`;
                conf.style.transition = 'all 0.5s ease-out';
                
                document.body.appendChild(conf);
                
                setTimeout(() => {
                    conf.style.opacity = '0';
                    setTimeout(() => conf.remove(), 500);
                }, 50);
            }
        }

        function launchFullConfetti() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF9F43', '#A29BFE'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const conf = document.createElement('div');
                    conf.className = 'confetti';
                    conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    conf.style.left = Math.random() * 100 + 'vw';
                    conf.style.top = '-5vh';
                    conf.style.animationDuration = (2 + Math.random() * 3) + 's';
                    document.body.appendChild(conf);
                    setTimeout(() => conf.remove(), 5000);
                }, i * 50);
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
