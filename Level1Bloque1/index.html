<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Test</title>
    <style>
        body { text-align: center; font-family: sans-serif; background-color: #f0f8ff; }
        .options-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .draggable { 
            font-size: 70px; 
            width: 120px; 
            height: 120px;
            line-height: 120px;
            cursor: grab; 
            border: 2px solid #333; 
            border-radius: 15px; 
            background: white; 
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .drop-zone { width: 250px; height: 250px; border: 4px dashed #333; margin: 20px auto; display: flex; align-items: center; justify-content: center; background: white; font-size: 20px; font-weight: bold; border-radius: 15px; }
        #result-btn { display: none; margin-top: 20px; padding: 15px 30px; font-size: 20px; background: #25D366; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; background: #fff; }
    </style>
</head>
<body>

    <h2 id="instruction">Listen!</h2>
    <button onclick="playTargetWord()">🔊 Hear the word</button>

    <div class="drop-zone" id="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)">
        Drop here
    </div>

    <div class="options-container" id="options"></div>
    
    <button id="result-btn" onclick="sendToWhatsApp()">Send to Teacher</button>

    <script>
        const questions = [
            { word: "Elephant", options: ["🐘", "🦁", "🐅"], correct: "🐘" },
            { word: "Lion", options: ["🐶", "🦁", "🐱"], correct: "🦁" },
            { word: "Tiger", options: ["🐅", "🐘", "🐶"], correct: "🐅" },
            { word: "Car", options: ["🧸", "🚗", "🤖"], correct: "🚗" },
            { word: "Guitar", options: ["🎸", "🎹", "☎️"], correct: "🎸" },
            { word: "Piano", options: ["☎️", "🎸", "🎹"], correct: "🎹" },
            { word: "Telephone", options: ["🎹", "☎️", "🎸"], correct: "☎️" },
            { word: "Banana", options: ["🍎", "🍌", "🍊"], correct: "🍌" },
            { word: "Apple", options: ["🍎", "🍌", "🍐"], correct: "🍎" },
            { word: "Orange", options: ["🍋", "🍎", "🍊"], correct: "🍊" },
            { word: "Doctor", options: ["👨‍🍳", "👨‍🚒", "👨‍⚕️"], correct: "👨‍⚕️" },
            { word: "Pilot", options: ["👨‍✈️", "👨‍⚕️", "👨‍🍳"], correct: "👨‍✈️" },
            { word: "Teddy bear", options: ["🧸", "🤖", "🪁"], correct: "🧸" },
            { word: "Robot", options: ["🚗", "🤖", "🪁"], correct: "🤖" },
            { word: "Jacket", options: ["🧥", "🧦", "👟"], correct: "🧥" }
        ];

        let currentQ = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQ];
            document.getElementById('instruction').innerText = "Question " + (currentQ + 1);
            const optContainer = document.getElementById('options');
            optContainer.innerHTML = '';
            
            q.options.forEach(emoji => {
                const box = document.createElement('div');
                box.innerText = emoji; 
                box.className = 'draggable'; 
                box.draggable = true;
                box.id = emoji; 
                box.ondragstart = (ev) => ev.dataTransfer.setData("text", ev.target.id);
                optContainer.appendChild(box);
            });
            document.getElementById('drop-zone').innerHTML = "Drop here";
        }

        function playTargetWord() { 
            const utterance = new SpeechSynthesisUtterance(questions[currentQ].word);
            utterance.lang = 'en-US'; 
            speechSynthesis.speak(utterance); 
        }
        
        function allowDrop(ev) { ev.preventDefault(); }
        
        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            
            if (data === questions[currentQ].correct) score++;
            
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                const finalGrade = Math.round((score / questions.length) * 10);
                document.getElementById('drop-zone').innerHTML = `Finished!<br>Score: ${finalGrade}/10`;
                document.getElementById('result-btn').style.display = "inline-block";
            }
        }

        function sendToWhatsApp() {
            const finalGrade = Math.round((score / questions.length) * 10);
            const text = `Hola teacher, he completado el test del primer bloque con el código B1/P${finalGrade}`;

            window.open(
                `https://api.whatsapp.com/send?phone=50235958788&text=${encodeURIComponent(text)}`,
                "_blank"
            );
        }

        loadQuestion();
    </script>
</body>
</html>
