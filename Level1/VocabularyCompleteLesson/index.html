<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEC English App</title>
    <style>
        body { text-align: center; font-family: sans-serif; background-color: #f0f8ff; padding: 20px; margin: 0; }
        .screen { display: none; }
        .active { display: block; }
        .main-btn { padding: 20px 40px; font-size: 20px; margin: 15px; cursor: pointer; border-radius: 20px; border: none; background: #4ECDC4; color: white; transition: 0.3s; }
        .main-btn:hover { background: #45b7af; }
        .main-btn:disabled { background: #bdc3c7; cursor: not-allowed; }

        /* Estilos de Tarjetas con Giro */
        .card-container { 
            width: 120px; height: 120px; perspective: 1000px; margin: 10px; 
            cursor: pointer; display: inline-block; position: relative;
            transition: transform 0.2s;
        }
        .card-container.selected {
            transform: scale(1.05);
        }
        .card-container.selected .card-front,
        .card-container.selected .card-back {
            border-color: #f39c12;
            box-shadow: 0 0 15px #f39c12;
        }
        .card-inner { 
            position: relative; width: 100%; height: 100%; text-align: center; 
            transition: transform 0.6s; transform-style: preserve-3d; 
        }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            border-radius: 20px; display: flex; align-items: center; justify-content: center; 
            font-size: 50px; border: 3px solid #e67e22; background: white;
        }
        .card-back { 
            background: #fff3e0; transform: rotateY(180deg); font-size: 18px; 
            font-weight: bold; padding: 5px; box-sizing: border-box; 
        }
        .card-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px; }

        /* Checkbox de selección en la tarjeta */
        .select-circle {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 30px;
            height: 30px;
            background: white;
            border: 3px solid #e67e22;
            border-radius: 50%;
            z-index: 10;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            transition: all 0.2s;
        }
        .select-circle:hover {
            transform: scale(1.1);
        }
        .card-container.selected .select-circle {
            background: #27ae60;
            border-color: #27ae60;
        }

        /* Botón flotante de generar quiz */
        .floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 100;
            animation: pulse 2s infinite;
        }
        .floating-btn:hover { background: #c0392b; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Estilos del Test */
        .options-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .draggable { 
            font-size: 50px; width: 100px; height: 100px; line-height: 100px; 
            cursor: grab; border: 2px solid #333; border-radius: 15px; 
            background: white; user-select: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .drop-zone { 
            width: 200px; height: 200px; border: 4px dashed #333; margin: 20px auto; 
            display: flex; align-items: center; justify-content: center; 
            background: white; font-size: 18px; font-weight: bold; border-radius: 15px; 
        }
        .review-item-box { 
            font-size: 50px; width: 100px; height: 100px; line-height: 100px; 
            border: 2px solid #e67e22; border-radius: 15px; background: #fff3e0; cursor: pointer; 
        }
        .stars-container { margin: 20px 0; font-size: 40px; }
        .star { color: #ccc; } .star.filled { color: #FFD700; }
        .review-section { margin-top: 20px; padding: 20px; border-top: 2px solid #ccc; display: none; }
        .review-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 15px; }

        /* Botón bocina con palabra */
        .audio-container { margin: 20px 0; }
        .audio-btn { 
            padding: 15px 30px; font-size: 24px; cursor: pointer; border-radius: 15px; 
            border: none; background: #3498db; color: white; transition: 0.3s; 
        }
        .audio-btn:hover { background: #2980b9; }
        .word-display { 
            font-size: 32px; font-weight: bold; color: #e67e22; margin-top: 15px; 
            min-height: 50px; display: flex; align-items: center; justify-content: center; 
        }

        h1 { color: #2c3e50; }
        h2 { color: #34495e; }
    </style>
</head>
<body>

    <!-- MENÚ PRINCIPAL -->
    <div id="home-screen" class="screen active">
        <h1>🎓 Welcome to UEC Academy!</h1>
        <button class="main-btn" onclick="showScreen('study-screen')">📚 Review Vocabulary</button>
        <button class="main-btn" onclick="startRandomTest()">🎮 Start Random Test</button>
    </div>

    <!-- PANTALLA DE REPASO -->
    <div id="study-screen" class="screen">
        <h2>📚 Vocabulary Review</h2>
        <p style="color: #7f8c8d; font-size: 16px;">
            👆 Tap a card to hear the word<br>
            ⭕ Tap the circle to select for custom quiz
        </p>
        <div id="flashcards" class="card-grid"></div>
        <br>
        <button class="main-btn" onclick="showScreen('home-screen')">⬅️ Back to Menu</button>
        <button class="main-btn" onclick="clearSelection()" style="background: #95a5a6;">🗑️ Clear Selection</button>
    </div>

    <!-- PANTALLA DEL TEST (común para random y personalizado) -->
    <div id="test-screen" class="screen">
        <h2 id="instruction">Listen!</h2>
        
        <div class="audio-container">
            <button class="audio-btn" onclick="playTargetWord()">🔊 Hear the word</button>
            <div class="word-display" id="word-display"></div>
        </div>

        <div class="drop-zone" id="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)">Drop here</div>
        <div class="options-container" id="options"></div>
        
        <div id="result-screen" style="display:none;">
            <div class="stars-container" id="stars"></div>
            <div id="review-section" class="review-section">
                <h3>📝 Let's Review! (Click to hear)</h3>
                <div class="review-grid" id="review-grid"></div>
            </div>
            <button class="main-btn" onclick="restartGame()">🔄 Play Again</button>
            <button class="main-btn" onclick="showScreen('home-screen')" style="background: #95a5a6;">🏠 Menu</button>
        </div>
        <br>
        <button class="main-btn" onclick="showScreen('home-screen')" style="background: #95a5a6;">⬅️ Back to Menu</button>
    </div>

    <!-- BOTÓN FLOTANTE PARA GENERAR QUIZ -->
    <button id="generate-quiz-btn" class="floating-btn" onclick="startCustomQuiz()">
        🎯 Generate Quiz (<span id="selected-count">0</span>)
    </button>

    <script>
        // Lista completa de palabras
        const allWords = [
            { word: "Mouse", emoji: "🐭" }, { word: "Elephant", emoji: "🐘" }, { word: "Lion", emoji: "🦁" },
            { word: "Tiger", emoji: "🐯" }, { word: "Dinosaur", emoji: "🦖" }, { word: "Cat", emoji: "🐱" },
            { word: "Dog", emoji: "🐶" }, { word: "Fish", emoji: "🐟" }, { word: "Frog", emoji: "🐸" },
            { word: "Horse", emoji: "🐎" }, { word: "Rat", emoji: "🐀" }, { word: "Panda", emoji: "🐼" },
            { word: "Car", emoji: "🚗" }, { word: "Guitar", emoji: "🎸" }, { word: "Piano", emoji: "🎹" },
            { word: "Telephone", emoji: "☎️" }, { word: "Ball", emoji: "⚽" }, { word: "Teddy bear", emoji: "🧸" },
            { word: "Block", emoji: "🧱" }, { word: "Doll", emoji: "🪆" }, { word: "Kite", emoji: "🪁" },
            { word: "Plane", emoji: "✈️" }, { word: "Robot", emoji: "🤖" }, { word: "Train", emoji: "🚂" },
            { word: "Lava", emoji: "🌋" }, { word: "Banana", emoji: "🍌" }, { word: "Apple", emoji: "🍎" },
            { word: "Pear", emoji: "🍐" }, { word: "Peach", emoji: "🍑" }, { word: "Orange", emoji: "🍊" },
            { word: "Melon", emoji: "🍈" }, { word: "Mango", emoji: "🥭" }, { word: "Lemon", emoji: "🍋" },
            { word: "Broccoli", emoji: "🥦" }, { word: "Ice cream", emoji: "🍦" }, { word: "Donuts", emoji: "🍩" },
            { word: "Juice", emoji: "🧃" }, { word: "Popcorn", emoji: "🍿" }, { word: "Pizza", emoji: "🍕" },
            { word: "Soup", emoji: "🥣" }, { word: "Jacket", emoji: "🧥" }, { word: "Blouse", emoji: "👚" },
            { word: "Socks", emoji: "🧦" }, { word: "Shoe", emoji: "👟" }, { word: "Boot", emoji: "👢" },
            { word: "Shirt", emoji: "👕" }, { word: "Scarf", emoji: "🧣" }, { word: "Hat", emoji: "👒" },
            { word: "Tie", emoji: "👔" }, { word: "Finger", emoji: "👈" }, { word: "Nose", emoji: "👃" },
            { word: "Chin", emoji: "🤔" }, { word: "Arm", emoji: "💪" }, { word: "Leg", emoji: "🦵" },
            { word: "Foot", emoji: "🦶" }, { word: "Knees", emoji: "🧎" }, { word: "Toes", emoji: "👣" },
            { word: "Eyes", emoji: "👀" }, { word: "Ear", emoji: "👂" }, { word: "Mouth", emoji: "👄" },
            { word: "Hand", emoji: "✋" }, { word: "Chef", emoji: "👨‍🍳" }, { word: "Doctor", emoji: "👩‍⚕️" },
            { word: "Firefighter", emoji: "👨‍🚒" }, { word: "Pilot", emoji: "👨‍✈️" }, { word: "Teacher", emoji: "👩‍🏫" },
            { word: "Construction worker", emoji: "👷" }, { word: "Dentist", emoji: "🦷" }, { word: "Carpenter", emoji: "🔨" },
            { word: "Soccer player", emoji: "🧑‍⚽" }, { word: "Farmer", emoji: "🧑‍🌾" }, { word: "Artist", emoji: "🎨" },
            { word: "Astronaut", emoji: "👨‍🚀" }, { word: "Yellow", emoji: "🟡" }, { word: "Red", emoji: "🔴" },
            { word: "Black", emoji: "⚫" }, { word: "White", emoji: "⚪" }, { word: "Gray", emoji: "🩶" },
            { word: "Green", emoji: "🟢" }, { word: "Brown", emoji: "🤎" }, { word: "Blue", emoji: "🔵" },
            { word: "Orange", emoji: "🟠" }, { word: "Pink", emoji: "🩷" }
        ];

        let selectedWords = new Set(); // Palabras seleccionadas para quiz personalizado
        let currentTestWords = []; // Palabras usadas en el test actual
        let questions = [];
        let currentQ = 0;
        let score = 0;
        let missed = [];
        let testMode = 'random'; // 'random' o 'custom'

        // --- NAVEGACIÓN ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            // Mostrar/ocultar botón flotante según la pantalla
            const floatingBtn = document.getElementById('generate-quiz-btn');
            if (id === 'study-screen') {
                updateFloatingButton();
                floatingBtn.style.display = 'block';
            } else {
                floatingBtn.style.display = 'none';
            }
        }

        // --- TARJETAS DE REPASO ---
        function buildFlashcards() {
            const flashContainer = document.getElementById('flashcards');
            flashContainer.innerHTML = '';
            
            allWords.forEach((w, index) => {
                const container = document.createElement('div');
                container.className = 'card-container';
                container.dataset.index = index;
                
                container.innerHTML = `
                    <div class="select-circle" onclick="event.stopPropagation(); toggleSelect(${index})"></div>
                    <div class="card-inner">
                        <div class="card-front">${w.emoji}</div>
                        <div class="card-back">${w.word}</div>
                    </div>
                `;
                
                // Click en la tarjeta (no en el círculo) = girar y pronunciar
                container.onclick = () => {
                    const inner = container.querySelector('.card-inner');
                    speakWord(w.word);
                    inner.classList.add('flipped');
                    setTimeout(() => inner.classList.remove('flipped'), 1500);
                };
                
                flashContainer.appendChild(container);
            });
        }

        function toggleSelect(index) {
            const container = document.querySelector(`.card-container[data-index="${index}"]`);
            const circle = container.querySelector('.select-circle');
            
            if (selectedWords.has(index)) {
                selectedWords.delete(index);
                container.classList.remove('selected');
                circle.innerHTML = '';
            } else {
                selectedWords.add(index);
                container.classList.add('selected');
                circle.innerHTML = '✓';
            }
            
            updateFloatingButton();
        }

        function updateFloatingButton() {
            const btn = document.getElementById('generate-quiz-btn');
            const count = document.getElementById('selected-count');
            count.innerText = selectedWords.size;
            
            if (selectedWords.size >= 3) {
                btn.disabled = false;
                btn.style.background = '#e74c3c';
            } else {
                btn.disabled = true;
                btn.style.background = '#95a5a6';
            }
        }

        function clearSelection() {
            selectedWords.clear();
            document.querySelectorAll('.card-container').forEach(c => {
                c.classList.remove('selected');
                c.querySelector('.select-circle').innerHTML = '';
            });
            updateFloatingButton();
        }

        // --- AUDIO ---
        function speakWord(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            speechSynthesis.speak(u);
        }

        // --- GENERACIÓN DE PREGUNTAS ---
        function generateQuestionsFrom(wordList) {
            const shuffled = [...wordList].sort(() => Math.random() - 0.5);
            const numQuestions = Math.min(10, shuffled.length);
            const generatedQuestions = [];
            
            for (let i = 0; i < numQuestions; i++) {
                const correctWord = shuffled[i];
                
                // Obtener 2 palabras incorrectas aleatorias de TODA la lista
                const otherWords = allWords
                    .filter(w => w.word !== correctWord.word)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 2);
                
                const options = [
                    correctWord.emoji,
                    otherWords[0].emoji,
                    otherWords[1].emoji
                ].sort(() => Math.random() - 0.5);
                
                generatedQuestions.push({
                    word: correctWord.word,
                    options: options,
                    correct: correctWord.emoji
                });
            }
            
            return generatedQuestions;
        }

        // --- INICIAR TESTS ---
        function startRandomTest() {
            testMode = 'random';
            currentTestWords = allWords;
            questions = generateQuestionsFrom(allWords);
            resetTestUI();
            showScreen('test-screen');
            loadQuestion();
        }

        function startCustomQuiz() {
            if (selectedWords.size < 3) return;
            
            testMode = 'custom';
            currentTestWords = Array.from(selectedWords).map(i => allWords[i]);
            questions = generateQuestionsFrom(currentTestWords);
            resetTestUI();
            showScreen('test-screen');
            loadQuestion();
        }

        function resetTestUI() {
            currentQ = 0;
            score = 0;
            missed = [];
            document.getElementById('instruction').style.display = 'block';
            document.getElementById('drop-zone').style.display = 'flex';
            document.getElementById('options').style.display = 'flex';
            document.querySelector('.audio-container').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('review-section').style.display = 'none';
            document.getElementById('word-display').innerText = '';
        }

        // --- LÓGICA DEL TEST ---
        function playTargetWord() {
            const q = questions[currentQ];
            const wordDisplay = document.getElementById('word-display');
            
            speakWord(q.word);
            wordDisplay.innerText = q.word;
            
            setTimeout(() => {
                wordDisplay.innerText = '';
            }, 1000);
        }

        function allowDrop(e) { e.preventDefault(); }

        function drop(e) {
            e.preventDefault();
            const data = e.dataTransfer.getData("text");
            
            if (data === questions[currentQ].correct) {
                score++;
            } else {
                missed.push(questions[currentQ]);
            }
            
            currentQ++;
            
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function loadQuestion() {
            const q = questions[currentQ];
            document.getElementById('instruction').innerText = "Question " + (currentQ + 1) + " / " + questions.length;
            document.getElementById('word-display').innerText = '';
            
            const optContainer = document.getElementById('options');
            optContainer.innerHTML = '';
            
            q.options.forEach(emoji => {
                const box = document.createElement('div');
                box.innerText = emoji;
                box.className = 'draggable';
                box.draggable = true;
                box.id = emoji;
                box.ondragstart = (e) => e.dataTransfer.setData("text", e.target.id);
                optContainer.appendChild(box);
            });
            
            document.getElementById('drop-zone').innerHTML = "Drop here";
        }

        function showResults() {
            document.getElementById('instruction').style.display = 'none';
            document.getElementById('drop-zone').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.querySelector('.audio-container').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            
            const totalStars = Math.min(10, questions.length);
            const finalGrade = Math.round((score / questions.length) * totalStars);
            const starContainer = document.getElementById('stars');
            starContainer.innerHTML = '';
            
            for (let i = 0; i < totalStars; i++) {
                starContainer.innerHTML += `<span class="star ${i < finalGrade ? 'filled' : ''}">★</span>`;
            }
            
            if (missed.length > 0) {
                document.getElementById('review-section').style.display = 'block';
                const reviewGrid = document.getElementById('review-grid');
                reviewGrid.innerHTML = '';
                
                missed.forEach(m => {
                    reviewGrid.innerHTML += `<div class="review-item-box" onclick="speakWord('${m.word}')">${m.correct}</div>`;
                });
            }
        }

        function restartGame() {
            if (testMode === 'random') {
                questions = generateQuestionsFrom(allWords);
            } else {
                questions = generateQuestionsFrom(currentTestWords);
            }
            resetTestUI();
            loadQuestion();
        }

        // --- INICIALIZACIÓN ---
        buildFlashcards();
        updateFloatingButton();
    </script>
</body>
</html>
