<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Test - Review Mode</title>
    <style>
        body { text-align: center; font-family: sans-serif; background-color: #f0f8ff; }
        .options-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .draggable { 
            font-size: 50px; width: 100px; height: 100px; line-height: 100px;
            cursor: grab; border: 2px solid #333; border-radius: 15px; 
            background: white; user-select: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .drop-zone { width: 200px; height: 200px; border: 4px dashed #333; margin: 20px auto; display: flex; align-items: center; justify-content: center; background: white; font-size: 18px; font-weight: bold; border-radius: 15px; }
        .stars-container { margin: 20px 0; font-size: 40px; }
        .star { color: #ccc; }
        .star.filled { color: #FFD700; }
        .review-section { margin-top: 20px; padding: 20px; border-top: 2px solid #ccc; display: none; }
        .review-grid { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <h2 id="instruction">Listen!</h2>
    <button onclick="playTargetWord()">🔊 Hear the word</button>

    <div class="drop-zone" id="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)">
        Drop here
    </div>

    <div class="options-container" id="options"></div>
    
    <div id="result-screen" style="display:none;">
        <div class="stars-container" id="stars"></div>
        <div id="review-section" class="review-section">
            <h3>Let's Review!</h3>
            <div class="review-grid" id="review-grid"></div>
        </div>
    </div>

    <script>
        // Lista de 15 preguntas basada en tus palabras
        const questions = [
            { word: "Hand", options: ["✋", "🦶", "👂"], correct: "✋" },
            { word: "Foot", options: ["🦶", "✋", "👁️"], correct: "🦶" },
            { word: "Toes", options: ["🦶", "👣", "🖐️"], correct: "👣" },
            { word: "Broccoli", options: ["🥦", "🍕", "🍿"], correct: "🥦" },
            { word: "Finger", options: ["👈", "👃", "👄"], correct: "👈" },
            { word: "Popcorn", options: ["🍿", "🍕", "🥦"], correct: "🍿" },
            { word: "Purple", options: ["🟣", "🟤", "⚪"], correct: "🟣" },
            { word: "Brown", options: ["🟤", "🟣", "⚪"], correct: "🟤" },
            { word: "Teacher", options: ["👩‍🏫", "👨‍🚒", "👷"], correct: "👩‍🏫" },
            { word: "White", options: ["⚪", "🟣", "🟤"], correct: "⚪" },
            { word: "Pink", options: ["🌸", "🔵", "🟡"], correct: "🌸" },
            { word: "Firefighter", options: ["👨‍🚒", "👩‍🏫", "👷"], correct: "👨‍🚒" },
            { word: "Gray", options: ["🩶", "🔵", "🟡"], correct: "🩶" },
            { word: "Ears", options: ["👂", "👁️", "👄"], correct: "👂" },
            { word: "Pizza", options: ["🍕", "🍿", "🥦"], correct: "🍕" }
        ];

        let currentQ = 0;
        let score = 0;
        let missed = [];

        function loadQuestion() {
            const q = questions[currentQ];
            document.getElementById('instruction').innerText = "Question " + (currentQ + 1);
            const optContainer = document.getElementById('options');
            optContainer.innerHTML = '';
            q.options.forEach(emoji => {
                const box = document.createElement('div');
                box.innerText = emoji; box.className = 'draggable'; box.draggable = true;
                box.id = emoji; box.ondragstart = (e) => e.dataTransfer.setData("text", e.target.id);
                optContainer.appendChild(box);
            });
            document.getElementById('drop-zone').innerHTML = "Drop here";
        }

        function playTargetWord() { 
            const u = new SpeechSynthesisUtterance(questions[currentQ].word);
            u.lang = 'en-US'; speechSynthesis.speak(u); 
        }
        
        function allowDrop(e) { e.preventDefault(); }
        
        function drop(e) {
            e.preventDefault();
            const data = e.dataTransfer.getData("text");
            if (data === questions[currentQ].correct) score++;
            else missed.push(questions[currentQ]);
            
            currentQ++;
            if (currentQ < questions.length) loadQuestion();
            else showResults();
        }

        function showResults() {
            document.getElementById('instruction').style.display = 'none';
            document.getElementById('drop-zone').style.display = 'none';
            document.getElementById('options').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            // Calcular nota sobre 10
            const finalGrade = Math.round((score / questions.length) * 10);
            const starContainer = document.getElementById('stars');
            for (let i = 0; i < 10; i++) {
                starContainer.innerHTML += `<span class="star ${i < finalGrade ? 'filled' : ''}">★</span>`;
            }

            // Mostrar revisión si hubo errores
            if (missed.length > 0) {
                document.getElementById('review-section').style.display = 'block';
                const grid = document.getElementById('review-grid');
                missed.forEach(m => {
                    grid.innerHTML += `<div class="draggable">${m.correct}</div>`;
                });
            }
        }

        loadQuestion();
    </script>
</body>
</html>
