<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Words: Aprende Vocabulario</title>
    <style>
        /* --- ESTILO GENERAL Y TEMA ESPACIAL --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: radial-gradient(circle at center, #1a1a40 0%, #050510 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s infinite linear;
            opacity: 0.6;
        }

        @keyframes twinkle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); }
        }

        /* --- CONTENEDOR DEL JUEGO --- */
        #game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            position: relative;
            z-index: 10;
        }

        .character {
            font-size: 5rem;
            margin-bottom: 10px;
            animation: bounce 2s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- BOTÓN DE AUDIO --- */
        .audio-button-container {
            margin: 20px 0;
        }

        .audio-button {
            background: linear-gradient(145deg, #00ffff, #0088ff);
            border: none;
            border-radius: 20px;
            padding: 20px 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 #005599, 0 15px 20px rgba(0,0,0,0.4);
            display: inline-block;
        }

        .audio-button:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #005599, 0 0 0 rgba(0,0,0,0.4);
        }

        .audio-button:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
        }

        .audio-emoji {
            font-size: 3rem;
        }

        .word-display {
            font-size: 2.5rem;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-top: 15px;
            font-weight: bold;
            text-transform: uppercase;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- OPCIONES GIGANTES --- */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .option-btn {
            background: linear-gradient(145deg, #5d6d7e, #34495e);
            border: none;
            border-radius: 20px;
            padding: 20px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 #2c3e50, 0 15px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
        }

        .option-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #2c3e50, 0 0 0 rgba(0,0,0,0.4);
        }

        .option-btn:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
        }

        .option-emoji {
            font-size: 5rem;
        }

        /* --- PANTALLA DE VICTORIA --- */
        #victory-screen {
            display: none;
        }
        .victory-emoji {
            font-size: 6rem;
            animation: spin 3s infinite linear;
        }
        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .victory-text {
            font-size: 2.5rem;
            color: #00ff88;
            text-shadow: 0 0 15px #00ff88;
            margin: 20px 0;
            font-weight: bold;
        }

        /* --- SECCIÓN DE REPASO (NUEVO) --- */
        #review-section {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 50, 50, 0.15);
            border: 2px dashed #ffaa00;
            border-radius: 20px;
        }
        .review-title {
            font-size: 1.4rem;
            color: #ffaa00;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .review-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .review-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .review-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            transform: scale(1.1);
        }
        .review-emoji {
            font-size: 3.5rem;
        }
        .review-hint {
            font-size: 1rem;
            color: #aaa;
            margin-top: 15px;
        }

        .restart-btn {
            margin-top: 30px;
            background: #00ff88;
            color: #003311;
            font-size: 1.5rem;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 0 #00994d;
        }
        .restart-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* --- OVERLAY DEL MONSTRUO (ERROR) --- */
        #monster-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .monster {
            font-size: 8rem;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .monster-text {
            font-size: 3rem;
            color: #ff3333;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0000;
            margin-top: 20px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div id="game-container">
        <!-- PANTALLA DE JUEGO -->
        <div id="game-screen">
            <div class="character" id="character">👨‍🚀</div>
            
            <div class="audio-button-container">
                <button class="audio-button" id="audio-button" onclick="playWord()">
                    <div class="audio-emoji">🔊</div>
                </button>
                <div class="word-display" id="word-display"></div>
            </div>
            
            <div class="options-grid" id="options-container"></div>
        </div>

        <!-- PANTALLA DE VICTORIA -->
        <div id="victory-screen">
            <div class="victory-emoji">🏆</div>
            <div class="character">👨‍🚀🎉</div>
            <div class="victory-text">Excellent! Great job!</div>
            <div class="victory-text">Mission Accomplished!</div>
            
            <!-- NUEVA SECCIÓN DE REPASO -->
            <div id="review-section">
                <div class="review-title">📝 Palabras para repasar:</div>
                <div class="review-grid" id="review-container"></div>
                <div class="review-hint">(Toca cualquier imagen para escucharla de nuevo)</div>
            </div>

            <button class="restart-btn" onclick="restartGame()">Jugar de nuevo</button>
        </div>
    </div>

    <!-- OVERLAY DEL MONSTRUO -->
    <div id="monster-overlay">
        <div class="monster">👾</div>
        <div class="monster-text">Oops! Try again</div>
    </div>

    <script>
        // --- DATOS DEL JUEGO ---
        const allWords = [
            { text: "Mouse", emoji: "🐭" }, { text: "Elephant", emoji: "🐘" }, { text: "Lion", emoji: "🦁" },
            { text: "Tiger", emoji: "🐯" }, { text: "Dinosaur", emoji: "🦖" }, { text: "Cat", emoji: "🐱" },
            { text: "Dog", emoji: "🐶" }, { text: "Fish", emoji: "🐟" }, { text: "Frog", emoji: "🐸" },
            { text: "Horse", emoji: "🐎" }, { text: "Rat", emoji: "🐀" }, { text: "Panda", emoji: "🐼" },
            { text: "Car", emoji: "🚗" }, { text: "Guitar", emoji: "🎸" }, { text: "Piano", emoji: "🎹" },
            { text: "Telephone", emoji: "☎️" }, { text: "Ball", emoji: "⚽" }, { text: "Teddy bear", emoji: "🧸" },
            { text: "Block", emoji: "🧱" }, { text: "Doll", emoji: "🪆" }, { text: "Kite", emoji: "🪁" },
            { text: "Plane", emoji: "✈️" }, { text: "Robot", emoji: "🤖" }, { text: "Train", emoji: "🚂" },
            { text: "Lava", emoji: "🌋" }, { text: "Banana", emoji: "🍌" }, { text: "Apple", emoji: "🍎" },
            { text: "Pear", emoji: "🍐" }, { text: "Peach", emoji: "🍑" }, { text: "Orange", emoji: "🍊" },
            { text: "Melon", emoji: "🍈" }, { text: "Mango", emoji: "🥭" }, { text: "Lemon", emoji: "🍋" },
            { text: "Broccoli", emoji: "🥦" }, { text: "Ice cream", emoji: "🍦" }, { text: "Donut", emoji: "🍩" },
            { text: "Juice", emoji: "🧃" }, { text: "Popcorn", emoji: "🍿" }, { text: "Pizza", emoji: "🍕" },
            { text: "Soup", emoji: "🥣" }, { text: "Jacket", emoji: "🧥" }, { text: "Blouse", emoji: "👚" }, { text: "Socks", emoji: "🧦" }, { text: "Shoe", emoji: "👟" },
            { text: "Boot", emoji: "👢" }, { text: "Shirt", emoji: "👕" }, { text: "Scarf", emoji: "🧣" },
            { text: "Hat", emoji: "👒" }, { text: "Tie", emoji: "👔" }, { text: "Finger", emoji: "👈" },
            { text: "Nose", emoji: "👃" }, { text: "Chin", emoji: "🤔" }, { text: "Arm", emoji: "💪" },
            { text: "Leg", emoji: "🦵" }, { text: "Foot", emoji: "🦶" }, { text: "Knees", emoji: "🧎" },
            { text: "Toes", emoji: "👣" }, { text: "Eyes", emoji: "👀" }, { text: "Ear", emoji: "👂" },
            { text: "Mouth", emoji: "👄" }, { text: "Hand", emoji: "✋" }, { text: "Chef", emoji: "👨‍🍳" },
            { text: "Doctor", emoji: "👩‍⚕️" }, { text: "Firefighter", emoji: "👨‍🚒" }, { text: "Pilot", emoji: "👨‍✈️" },
            { text: "Teacher", emoji: "👩‍🏫" }, { text: "Construction worker", emoji: "👷" }, { text: "Dentist", emoji: "🦷" },
            { text: "Carpenter", emoji: "🔨" }, { text: "Soccer player", emoji: "🧑‍⚽" }, { text: "Farmer", emoji: "🧑‍🌾" },
            { text: "Artist", emoji: "🎨" }, { text: "Astronaut", emoji: "👨‍🚀" }, { text: "Yellow", emoji: "🟡" },
            { text: "Red", emoji: "🔴" }, { text: "Black", emoji: "⚫" }, { text: "White", emoji: "⚪" },
            { text: "Gray", emoji: "🩶" }, { text: "Green", emoji: "🟢" }, { text: "Brown", emoji: "🤎" },
            { text: "Blue", emoji: "🔵" }, { text: "Orange", emoji: "🟠" }, { text: "Pink", emoji: "🩷" }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let audioContext = null;
        let speechSynthesis = window.speechSynthesis;
        let mistakes = []; // <-- NUEVO: Array para guardar los errores

        function generateQuestions() {
            const shuffled = [...allWords].sort(() => Math.random() - 0.5);
            const numQuestions = Math.min(10, shuffled.length);
            
            for (let i = 0; i < numQuestions; i++) {
                const correctWord = shuffled[i];
                const otherWords = shuffled.filter(w => w.text !== correctWord.text).sort(() => Math.random() - 0.5).slice(0, 2);
                
                const options = [
                    { text: correctWord.text, emoji: correctWord.emoji, isCorrect: true },
                    { text: otherWords[0].text, emoji: otherWords[0].emoji, isCorrect: false },
                    { text: otherWords[1].text, emoji: otherWords[1].emoji, isCorrect: false }
                ].sort(() => Math.random() - 0.5);
                
                questions.push({
                    word: correctWord.text,
                    options: options
                });
            }
        }

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function speakWord(text) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                utterance.pitch = 1.1;
                speechSynthesis.speak(utterance);
            }
        }

        function playWord() {
            initAudio();
            const q = questions[currentQuestionIndex];
            const wordDisplay = document.getElementById('word-display');
            
            wordDisplay.textContent = q.word;
            speakWord(q.word);
            
            setTimeout(() => {
                wordDisplay.textContent = '';
            }, 1000);
        }

        function playDing() {
            initAudio();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function playOops() {
            initAudio();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioContext.currentTime);
            oscillator.frequency.linearRampToValueAtTime(100, audioContext.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('word-display').textContent = '';
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<div class="option-emoji">${opt.emoji}</div>`;
                btn.onclick = () => checkAnswer(opt.isCorrect);
                container.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect) {
            initAudio();
            if (isCorrect) {
                playDing();
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < questions.length) {
                        loadQuestion();
                    } else {
                        showVictory();
                    }
                }, 600);
            } else {
                // <-- NUEVO: Guardar la palabra correcta de esta pregunta para el repaso final
                const currentQ = questions[currentQuestionIndex];
                const correctOpt = currentQ.options.find(opt => opt.isCorrect);
                
                // Solo la agregamos si no está ya en la lista (para no repetir)
                if (!mistakes.some(m => m.text === correctOpt.text)) {
                    mistakes.push({ text: correctOpt.text, emoji: correctOpt.emoji });
                }
                
                playOops();
                showMonster();
                setTimeout(hideMonster, 1500);
            }
        }

        function showMonster() {
            document.getElementById('monster-overlay').style.display = 'flex';
        }

        function hideMonster() {
            document.getElementById('monster-overlay').style.display = 'none';
        }

        function showVictory() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('victory-screen').style.display = 'block';
            
            // <-- NUEVO: Lógica para mostrar el cuadro de repaso
            const reviewSection = document.getElementById('review-section');
            const reviewContainer = document.getElementById('review-container');
            reviewContainer.innerHTML = ''; // Limpiar repaso anterior
            
            if (mistakes.length > 0) {
                reviewSection.style.display = 'block';
                mistakes.forEach(m => {
                    const btn = document.createElement('button');
                    btn.className = 'review-btn';
                    btn.innerHTML = `<div class="review-emoji">${m.emoji}</div>`;
                    btn.onclick = () => speakWord(m.text); // Al tocar, dice la palabra en inglés
                    reviewContainer.appendChild(btn);
                });
            } else {
                reviewSection.style.display = 'none'; // Si no hubo errores, se oculta el cuadro
            }
            
            setTimeout(() => {
                const victoryText = "Excellent! Great job! Mission accomplished!";
                speakWord(victoryText);
            }, 500);
            
            playDing();
            setTimeout(playDing, 300);
            setTimeout(playDing, 600);
        }

        function restartGame() {
            currentQuestionIndex = 0;
            mistakes = []; // <-- NUEVO: Limpiar la lista de errores al reiniciar
            questions = [];
            generateQuestions();
            document.getElementById('victory-screen').style.display = 'none';
            document.getElementById('game-screen').classList.remove('hidden');
            loadQuestion();
        }

        // --- INICIO ---
        generateQuestions();
        loadQuestion();
        document.body.addEventListener('click', initAudio, { once: true });
    </script>
</body>
</html>
