<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEC English App</title>
    <style>
        body { text-align: center; font-family: sans-serif; background-color: #f0f8ff; padding: 20px; }
        .screen { display: none; }
        .active { display: block; }
        .main-btn { padding: 20px 40px; font-size: 20px; margin: 15px; cursor: pointer; border-radius: 20px; border: none; background: #4ECDC4; color: white; transition: 0.3s; }
        .main-btn:hover { background: #45b7af; }

        /* Estilos de Tarjetas con Giro */
        .card-container { width: 120px; height: 120px; perspective: 1000px; margin: 10px; cursor: pointer; display: inline-block; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 50px; border: 3px solid #e67e22; }
        .card-front { background: white; }
        .card-back { background: #fff3e0; transform: rotateY(180deg); font-size: 18px; font-weight: bold; padding: 5px; box-sizing: border-box; }
        .card-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px; }

        /* Estilos del Test */
        .options-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .draggable { font-size: 50px; width: 100px; height: 100px; line-height: 100px; cursor: grab; border: 2px solid #333; border-radius: 15px; background: white; user-select: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .drop-zone { width: 200px; height: 200px; border: 4px dashed #333; margin: 20px auto; display: flex; align-items: center; justify-content: center; background: white; font-size: 18px; font-weight: bold; border-radius: 15px; }
        .review-item-box { font-size: 50px; width: 100px; height: 100px; line-height: 100px; border: 2px solid #e67e22; border-radius: 15px; background: #fff3e0; cursor: pointer; }
        .stars-container { margin: 20px 0; font-size: 40px; }
        .star { color: #ccc; } .star.filled { color: #FFD700; }
        .review-section { margin-top: 20px; padding: 20px; border-top: 2px solid #ccc; display: none; }
        .review-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- MENÚ PRINCIPAL -->
    <div id="home-screen" class="screen active">
        <h1>Welcome to UEC Academy!</h1>
        <button class="main-btn" onclick="showScreen('study-screen')">📚 Review Vocabulary</button>
        <button class="main-btn" onclick="showScreen('test-screen')">🎮 Start Test</button>
    </div>

    <!-- PANTALLA DE REPASO -->
    <div id="study-screen" class="screen">
        <h2>Click to hear the words!</h2>
        <div id="flashcards" class="card-grid"></div>
        <br><button class="main-btn" onclick="showScreen('home-screen')">⬅️ Back to Menu</button>
    </div>

    <!-- PANTALLA DEL TEST -->
    <div id="test-screen" class="screen">
        <h2 id="instruction">Listen!</h2>
        <button onclick="playTargetWord()">🔊 Hear the word</button>
        <div class="drop-zone" id="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)">Drop here</div>
        <div class="options-container" id="options"></div>
        <div id="result-screen" style="display:none;">
            <div class="stars-container" id="stars"></div>
            <div id="review-section" class="review-section">
                <h3>Let's Review! (Click to hear)</h3>
                <div class="review-grid" id="review-grid"></div>
            </div>
            <button class="main-btn" onclick="location.reload()">Play Again</button>
        </div>
        <br><button class="main-btn" onclick="showScreen('home-screen')">⬅️ Back to Menu</button>
    </div>

    <script>
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        const questions = [
            { word: "Hand", options: ["🦶", "✋", "👂"], correct: "✋" },
            { word: "Foot", options: ["👀", "✋", "🦶"], correct: "🦶" },
            { word: "Toes", options: ["🦶", "👣", "🖐️"], correct: "👣" },
            { word: "Broccoli", options: ["🥦", "🍕", "🍿"], correct: "🥦" },
            { word: "Finger", options: ["👄", "👃", "👈"], correct: "👈" },
            { word: "Popcorn", options: ["🍿", "🍕", "🥦"], correct: "🍿" },
            { word: "Purple", options: ["🟤", "🟣", "⚪"], correct: "🟣" },
            { word: "Brown", options: ["⚪", "🟣", "🟤"], correct: "🟤" },
            { word: "Teacher", options: ["👨‍🚒", "👩‍🏫", "👷"], correct: "👩‍🏫" },
            { word: "White", options: ["⚪", "🟣", "🟤"], correct: "⚪" },
            { word: "Pink", options: ["🔵", "🟡", "🌸"], correct: "🌸" },
            { word: "Firefighter", options: ["👨‍🚒", "👩‍🏫", "👷"], correct: "👨‍🚒" },
            { word: "Gray", options: ["🔵", "🩶", "🟡"], correct: "🩶" },
            { word: "Ears", options: ["👂", "👀", "👄"], correct: "👂" },
            { word: "Pizza", options: ["🍿", "🍕", "🥦"], correct: "🍕" }
        ];

        // Generar Tarjetas
        const flashContainer = document.getElementById('flashcards');
        questions.forEach(q => {
            const container = document.createElement('div');
            container.className = 'card-container';
            container.innerHTML = `<div class="card-inner"><div class="card-front">${q.correct}</div><div class="card-back">${q.word}</div></div>`;
            container.onclick = () => {
                const inner = container.querySelector('.card-inner');
                speakWord(q.word);
                inner.classList.add('flipped');
                setTimeout(() => inner.classList.remove('flipped'), 1500);
            };
            flashContainer.appendChild(container);
        });

        // Lógica del Test
        let currentQ = 0, score = 0, missed = [];
        function speakWord(text) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; speechSynthesis.speak(u); }
        function loadQuestion() {
            const q = questions[currentQ];
            document.getElementById('instruction').innerText = "Question " + (currentQ + 1);
            const optContainer = document.getElementById('options');
            optContainer.innerHTML = '';
            q.options.forEach(emoji => {
                const box = document.createElement('div');
                box.innerText = emoji; box.className = 'draggable'; box.draggable = true;
                box.id = emoji; box.ondragstart = (e) => e.dataTransfer.setData("text", e.target.id);
                optContainer.appendChild(box);
            });
            document.getElementById('drop-zone').innerHTML = "Drop here";
        }
        function playTargetWord() { speakWord(questions[currentQ].word); }
        function allowDrop(e) { e.preventDefault(); }
        function drop(e) {
            e.preventDefault();
            const data = e.dataTransfer.getData("text");
            if (data === questions[currentQ].correct) score++; else missed.push(questions[currentQ]);
            currentQ++;
            if (currentQ < questions.length) loadQuestion(); else showResults();
        }
        function showResults() {
            document.getElementById('instruction').style.display = 'none'; document.getElementById('drop-zone').style.display = 'none'; document.getElementById('options').style.display = 'none'; document.getElementById('result-screen').style.display = 'block';
            const finalGrade = Math.round((score / questions.length) * 10);
            const starContainer = document.getElementById('stars');
            for (let i = 0; i < 10; i++) starContainer.innerHTML += `<span class="star ${i < finalGrade ? 'filled' : ''}">★</span>`;
            if (missed.length > 0) {
                document.getElementById('review-section').style.display = 'block';
                missed.forEach(m => document.getElementById('review-grid').innerHTML += `<div class="review-item-box" onclick="speakWord('${m.word}')">${m.correct}</div>`);
            }
        }
        loadQuestion();
    </script>
</body>
</html>
