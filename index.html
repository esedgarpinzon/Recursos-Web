<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English App - Maestro Edgar</title>
    <style>
        /* Diseño General */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; margin: 0; text-align: center; }
        h1 { color: #2c3e45; padding: 20px; margin: 0; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        
        /* Estilo de los Menús */
        .menu-btn { width: 100%; padding: 25px; margin-bottom: 15px; font-size: 20px; font-weight: bold; border: none; border-radius: 15px; cursor: pointer; color: white; box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: 0.2s; }
        .menu-btn:active { transform: translateY(4px); box-shadow: none; }
        .bg-animals { background-color: #ff9f43; }
        .bg-greetings { background-color: #54a0ff; }
        
        /* Estilo de las Secciones (Ocultas al inicio) */
        .section { display: none; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        
        /* Tarjetas de Vocabulario */
        .card { background: white; border-radius: 15px; padding: 10px; border: 3px solid #ddd; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: #54a0ff; transform: scale(1.05); }
        .card img { width: 100%; border-radius: 10px; height: 100px; object-fit: cover; }
        .card-text { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; color: #333; }
        
        /* Botón de Regresar */
        .back-btn { background: #576574; color: white; padding: 10px 20px; border: none; border-radius: 20px; margin-top: 30px; cursor: pointer; font-weight: bold; }

        /* Estilo extra de fondo (Opcional) */
        .watermark {
          position: fixed; bottom: 10px; right: 10px; opacity: 0.3; font-family: monospace; font-size: 10px;
        }
    </style>
</head>
<body>

    <h1>🍎 My English Class</h1>

    <div class="container">
        
        <div id="main-menu">
            <p>Choose a topic to practice:</p>
            <button class="menu-btn bg-animals" onclick="showSection('section-animals')">🦁 Section 1: Animals</button>
            <button class="menu-btn bg-greetings" onclick="showSection('section-greetings')">👋 Section 2: Greetings</button>
        </div>

        <div id="section-animals" class="section">
            <h2>Animals & Car</h2>
            <div class="grid">
                <div class="card" onclick="speak('Elephant')">
                    <img src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=200">
                    <span class="card-text">Elephant</span>
                </div>
                <div class="card" onclick="speak('Lion')">
                    <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=200">
                    <span class="card-text">Lion</span>
                </div>
                <div class="card" onclick="speak('Tiger')">
                    <img src="https://images.unsplash.com/photo-1552410260-0fd9b577afa6?w=200">
                    <span class="card-text">Tiger</span>
                </div>
                <div class="card" onclick="speak('Car')">
                    <img src="https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=200">
                    <span class="card-text">Car</span>
                </div>
            </div>
            <button class="back-btn" onclick="showMainMenu()">⬅ Back to Menu</button>
        </div>

        <div id="section-greetings" class="section">
            <h2>Greetings & Phrases</h2>
            <div class="grid">
                <div class="card" onclick="speak('Hello')">
                    <span style="font-size: 40px;">👋</span>
                    <span class="card-text">Hello</span>
                </div>
                <div class="card" onclick="speak('I am fine')">
                    <span style="font-size: 40px;">😊</span>
                    <span class="card-text">I am fine</span>
                </div>
                <div class="card" onclick="speak('How are you?')">
                    <span style="font-size: 40px;">❓</span>
                    <span class="card-text">How are you?</span>
                </div>
                <div class="card" onclick="speak('My name is')">
                    <span style="font-size: 40px;">🆔</span>
                    <span class="card-text">My name is...</span>
                </div>
            </div>
            <button class="back-btn" onclick="showMainMenu()">⬅ Back to Menu</button>
        </div>

    </div>

    <div class="watermark">U.E.C. Academy</div>

    <script>
        // Función para cambiar de sección
        function showSection(id) {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        // Función para volver al inicio
        function showMainMenu() {
            document.getElementById('main-menu').style.display = 'block';
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        }

        // Función de voz mejorada
        function speak(text) {
            const synth = window.speechSynthesis;
            const utterThis = new SpeechSynthesisUtterance(text);
            utterThis.lang = 'en-US';
            utterThis.rate = 0.8;
            synth.speak(utterThis);
        }
    </script>

</body>
</html>
